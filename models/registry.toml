# Catálogo oficial de modelos.
#
# [files.<id>]  Un archivo descargable. Varios modelos pueden compartirlo
#               (se borra solo cuando ningún modelo instalado lo usa).
#   repo/revision/path  Origen en Hugging Face; revision = commit fijado.
#   dest                Carpeta dentro de engine/ComfyUI/models/.
#   size/sha256         Se verifican al descargar.
#
# [[models]]    Lo que el usuario ve y elige en el addon.
#   family              Qué adaptador/workflow lo usa (core/workflows/).
#   roles               Etapas que cubre: shape, texture, parts.
#   files               IDs de [files.*] necesarios.

schema = 1

